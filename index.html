<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f4f0;color:#1a1a18;min-height:100vh;-webkit-tap-highlight-color:transparent;}
:root{
  --green:#1D9E75;--green-light:#E1F5EE;--green-dark:#085041;
  --gold:#BA7517;--gold-light:#FAEEDA;--amber:#EF9F27;
  --red:#E24B4A;--red-light:#FCEBEB;
  --card-bg:#fff;--border:rgba(0,0,0,0.10);--border-md:rgba(0,0,0,0.22);
  --radius:12px;--radius-md:8px;--text:#1a1a18;--text-sec:#666;--bg:#f5f4f0;--bg-sec:#f0eeea;
}
@media(prefers-color-scheme:dark){
  :root{--card-bg:#1c1c1e;--border:rgba(255,255,255,0.10);--border-md:rgba(255,255,255,0.22);--text:#f2f2f7;--text-sec:#8e8e93;--bg:#000;--bg-sec:#1c1c1e;}
  body{background:var(--bg);color:var(--text);}
}
.app{max-width:880px;margin:0 auto;padding:1.5rem 1rem 5rem;}
.header{display:flex;align-items:center;gap:12px;margin-bottom:2rem;}
.header-icon{width:44px;height:44px;background:var(--green);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;flex-shrink:0;}
.header h1{font-size:22px;font-weight:600;letter-spacing:-0.5px;color:var(--text);}
.header p{font-size:13px;color:var(--text-sec);margin-top:2px;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius-md);border:0.5px solid var(--border-md);background:transparent;color:var(--text);font-size:14px;cursor:pointer;transition:all 0.15s;white-space:nowrap;-webkit-tap-highlight-color:transparent;}
.btn:hover{background:var(--bg-sec);}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--green);color:#fff;border-color:var(--green-dark);}
.btn-primary:hover{background:var(--green-dark);}
.btn-danger{border-color:var(--red);color:var(--red);}
.btn-danger:hover{background:var(--red-light);}
.btn-sm{padding:6px 12px;font-size:12px;}
.btn-gold{background:var(--gold);color:#fff;border-color:#633806;}
.btn-gold:hover{background:#633806;}
.btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;}
.card{background:var(--card-bg);border:0.5px solid var(--border);border-radius:var(--radius);padding:1.25rem;margin-bottom:1rem;}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;}
.card-title{font-size:15px;font-weight:600;color:var(--text);}
.section-label{font-size:11px;font-weight:600;color:var(--text-sec);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px;}
input,select{width:100%;padding:10px 12px;border:0.5px solid var(--border-md);border-radius:var(--radius-md);font-size:16px;background:var(--card-bg);color:var(--text);-webkit-appearance:none;}
input:focus,select:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(29,158,117,0.15);}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:500;}
.badge-green{background:var(--green-light);color:var(--green-dark);}
.badge-gold{background:var(--gold-light);color:#633806;}
.player-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.player-avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0;}
.score-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.score-table{width:100%;border-collapse:collapse;font-size:12px;}
.score-table th{background:var(--green);color:#fff;padding:8px 6px;text-align:center;font-weight:600;white-space:nowrap;}
.score-table th:first-child{text-align:left;padding-left:10px;}
.score-table td{padding:6px;border-bottom:0.5px solid var(--border);text-align:center;vertical-align:middle;color:var(--text);}
.score-table td:first-child{text-align:left;padding-left:10px;}
.score-table tr:last-child td{border-bottom:none;}
.net-score{font-size:10px;color:var(--text-sec);}
.hole-input{width:44px;padding:5px 2px;text-align:center;border:0.5px solid var(--border-md);border-radius:6px;font-size:15px;background:var(--card-bg);color:var(--text);-webkit-appearance:none;}
.hole-input:focus{outline:none;border-color:var(--green);}
.tabs{display:flex;gap:0;margin-bottom:1.25rem;border-bottom:0.5px solid var(--border);}
.tab{flex:1;padding:10px 8px;font-size:14px;cursor:pointer;border-bottom:2px solid transparent;color:var(--text-sec);background:none;border-top:none;border-left:none;border-right:none;text-align:center;}
.tab.active{color:var(--green-dark);border-bottom-color:var(--green);font-weight:600;}
.empty-state{text-align:center;padding:3rem 1rem;color:var(--text-sec);}
.empty-state i{font-size:52px;display:block;margin-bottom:1rem;opacity:0.25;}
.round-list-item{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:0.5px solid var(--border);cursor:pointer;transition:background 0.1s;}
.round-list-item:hover{background:var(--green-light);}
.round-list-item:active{background:var(--green-light);}
.round-list-item:last-child{border-bottom:none;}
.banker-announce{background:var(--gold-light);border:1px solid var(--amber);border-radius:var(--radius-md);padding:10px 14px;display:flex;align-items:center;gap:8px;font-size:14px;color:#633806;margin-bottom:1rem;flex-wrap:wrap;}
.dropdown-list{border:0.5px solid var(--border-md);border-radius:var(--radius-md);margin-top:4px;max-height:220px;overflow-y:auto;background:var(--card-bg);position:relative;z-index:10;box-shadow:0 4px 16px rgba(0,0,0,0.12);}
.dropdown-item{padding:12px 14px;cursor:pointer;font-size:15px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;color:var(--text);}
.dropdown-item:last-child{border-bottom:none;}
.dropdown-item:hover,.dropdown-item:active{background:var(--green-light);}
.putt-input{width:72px;padding:6px 8px;border:0.5px solid var(--border-md);border-radius:6px;font-size:15px;text-align:center;background:var(--card-bg);color:var(--text);-webkit-appearance:none;}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600;}
.pill-win{background:var(--green-light);color:var(--green-dark);}
.pill-loss{background:var(--red-light);color:#791F1F;}
.pill-push{background:#F1EFE8;color:#444441;}
.pill-bank{background:var(--gold-light);color:#633806;}
.tally-row{display:flex;align-items:center;gap:10px;padding:12px;border-radius:var(--radius-md);border:0.5px solid var(--border);margin-bottom:8px;background:var(--card-bg);}
.tally-net{font-size:20px;font-weight:700;min-width:56px;text-align:right;}
.tally-net.pos{color:var(--green);}
.tally-net.neg{color:var(--red);}
.tally-net.zero{color:var(--text-sec);}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:center;z-index:200;padding:1rem;}
.modal{background:var(--card-bg);border-radius:var(--radius);padding:1.5rem;width:min(480px,100%);max-height:90vh;overflow-y:auto;}
.modal h2{font-size:17px;font-weight:600;margin-bottom:4px;color:var(--text);}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:1.25rem;}
.modal-step{font-size:13px;color:var(--text-sec);margin-bottom:1rem;padding:8px 12px;background:var(--bg-sec);border-radius:var(--radius-md);}
.flip-result{text-align:center;padding:1rem 0;}
.flip-result .emoji{font-size:52px;margin-bottom:0.5rem;}
.flip-result .winner{font-size:22px;font-weight:600;color:var(--green-dark);margin-bottom:6px;}
.player-sel-btn{display:flex;align-items:center;gap:10px;width:100%;padding:13px 14px;border-radius:var(--radius-md);border:2px solid var(--border);background:var(--card-bg);cursor:pointer;transition:all 0.15s;margin-bottom:8px;text-align:left;}
.player-sel-btn:active{transform:scale(0.98);}
.player-sel-btn.selected-banker{border-color:var(--amber);background:var(--gold-light);}
.player-sel-btn.selected-challenger{border-color:var(--green);background:var(--green-light);}
.sel-check{width:24px;height:24px;border-radius:50%;border:2px solid var(--border-md);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.15s;}
.player-sel-btn.selected-banker .sel-check{background:var(--amber);border-color:var(--amber);color:#fff;}
.player-sel-btn.selected-challenger .sel-check{background:var(--green);border-color:var(--green);color:#fff;}
.bet-chip{padding:4px 11px;border-radius:99px;font-size:13px;font-weight:600;margin-left:auto;flex-shrink:0;}
.bet-base{background:#F1EFE8;color:#444441;}
.bet-doubled{background:var(--gold-light);color:#633806;}
.bet-max{background:var(--red-light);color:#791F1F;}
.si-grid{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin-bottom:8px;}
.si-cell{text-align:center;}
.si-cell label{display:block;font-size:10px;color:var(--text-sec);margin-bottom:3px;font-weight:500;}
.si-input{width:100%;padding:6px 2px;text-align:center;border:0.5px solid var(--border-md);border-radius:6px;font-size:14px;background:var(--card-bg);color:var(--text);-webkit-appearance:none;}
.si-input:focus{outline:none;border-color:var(--green);}
.si-display{width:100%;padding:6px 2px;text-align:center;font-size:14px;font-weight:600;background:var(--bg-sec);border-radius:6px;color:var(--text);}
.payment-row{display:flex;align-items:center;gap:10px;padding:14px 0;border-bottom:0.5px solid var(--border);}
.payment-row:last-child{border-bottom:none;}
.amount-chip{padding:5px 16px;border-radius:99px;font-size:15px;font-weight:700;background:var(--green-light);color:var(--green-dark);flex-shrink:0;}
.course-list-item{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:0.5px solid var(--border);transition:background 0.1s;}
.course-list-item:last-child{border-bottom:none;}
.course-list-item:hover{background:var(--green-light);}
/* PWA install banner */
.install-banner{background:var(--green);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;}
.install-banner button{background:rgba(255,255,255,0.2);border:none;color:#fff;padding:6px 12px;border-radius:6px;font-size:13px;cursor:pointer;flex-shrink:0;}
</style>

<body>
<div id="install-banner" style="display:none" class="install-banner">
  <span>📱 Add Golf Banker to your home screen for the best experience!</span>
  <button onclick="document.getElementById('install-banner').style.display='none'">Got it</button>
</div>
<div class="app" id="root"></div>
<script>
// ── PWA install hint ───────────────────────────────────────────────────────
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
const isInStandalone=window.matchMedia('(display-mode:standalone)').matches||window.navigator.standalone;
if(isIOS&&!isInStandalone){
  setTimeout(()=>{document.getElementById('install-banner').style.display='flex';},2000);
}

const BASE_BET=5;
const SUGGESTED_COURSES=['Augusta National Golf Club','Pebble Beach Golf Links','Pinehurst No. 2','Torrey Pines (South)','TPC Sawgrass','Bethpage Black','Shinnecock Hills','Whistling Straits','Oakmont Country Club','Winged Foot Golf Club','Medinah Country Club','Congressional Country Club','Cherry Hills Country Club','Oakland Hills Country Club','Riviera Country Club','Hazeltine National','Firestone Country Club','Valhalla Golf Club','East Lake Golf Club','Muirfield Village Golf Club','Shadow Creek','Wolf Creek Golf Club','Bandon Dunes','Pacific Dunes','Spyglass Hill','Pelican Hill','Kiawah Island (Ocean)','Harbour Town Golf Links','Erin Hills','Quail Hollow Club','Bay Hill Club','Sea Island (Seaside)','Sedgefield Country Club','Innisbrook (Copperhead)','TPC Scottsdale (Stadium)','Poppy Hills Golf Course','Torrey Pines (North)','Bel-Air Country Club','Los Angeles Country Club','Sherwood Country Club','The Country Club (Brookline)','Bellerive Country Club','Interlachen Country Club','Southern Hills Country Club','Inverness Club','Baltusrol Golf Club','Merion Golf Club','St Andrews Links (Old)','Royal Birkdale','Royal Liverpool (Hoylake)','Carnoustie Golf Links','Muirfield','Royal St Georges','Royal Troon','Turnberry (Ailsa)','Royal Portrush','Sunningdale Golf Club','Wentworth Club','The K Club','Royal County Down','Waterville Golf Links'];

// ── Core helpers ──────────────────────────────────────────────────────────
function resolveDoubles(sel,bankerIdx,allIdxs){
  const bSel=sel.has(bankerIdx),cSel=allIdxs.filter(i=>i!==bankerIdx&&sel.has(i));
  const out={bankerDoubledGroup:false,challengerDoubled:{},bankerDoubledBack:{}};
  if(bSel){out.bankerDoubledGroup=true;cSel.forEach(i=>{out.bankerDoubledBack[i]=true;});}
  else cSel.forEach(i=>{out.challengerDoubled[i]=true;});
  return out;
}
function getBetAmount(doubles,ci){
  if(!doubles)return BASE_BET;let a=BASE_BET;
  if(doubles.bankerDoubledGroup)a*=2;
  if(doubles.challengerDoubled&&doubles.challengerDoubled[ci])a*=2;
  if(doubles.bankerDoubledBack&&doubles.bankerDoubledBack[ci])a*=2;
  return Math.min(a,BASE_BET*4);
}
function doublesSummary(doubles,bankerIdx,players){
  if(!doubles)return null;
  const{bankerDoubledGroup,challengerDoubled,bankerDoubledBack}=doubles,lines=[];
  if(bankerDoubledGroup){
    lines.push(`${players[bankerIdx].name} doubled the group → everyone $${BASE_BET*2}`);
    const b=Object.keys(bankerDoubledBack).filter(i=>bankerDoubledBack[i]).map(i=>players[i].name);
    if(b.length)lines.push(`Doubled back: ${b.join(', ')} → $${BASE_BET*4}`);
  } else {
    const w=Object.keys(challengerDoubled).filter(i=>challengerDoubled[i]).map(i=>players[i].name);
    if(w.length)lines.push(`${w.join(', ')} doubled → $${BASE_BET*2}`);
  }
  return lines.length?lines:null;
}
function strokesOnHole(hcp,hi,siArr){
  if(!siArr||siArr.length<18)return Math.floor(hcp/18)+(hi<hcp%18?1:0);
  const si=siArr[hi];return(hcp>=si?1:0)+(hcp-18>=si?1:0);
}
function netScore(gross,hcp,hi,siArr){
  if(gross===''||gross===null||gross===undefined)return null;
  const g=parseInt(gross);if(isNaN(g))return null;
  return g-strokesOnHole(hcp,hi,siArr);
}
function getBankerForHole(round,holeIdx){
  if(holeIdx===0)return round.initialBanker??0;
  const prevH=holeIdx-1,nets=round.players.map((p,i)=>netScore(round.scores[prevH][i],p.hcp,prevH,round.strokeIndexes));
  const valid=nets.filter(n=>n!==null);if(!valid.length)return getBankerForHole(round,holeIdx-1);
  const min=Math.min(...valid),tied=nets.map((n,i)=>n===min?i:-1).filter(i=>i>=0);
  if(tied.length===1)return tied[0];
  const tr=round.tieResolution&&round.tieResolution[String(prevH)];
  if(tr&&tr.winner!==undefined)return tr.winner;
  return getBankerForHole(round,prevH);
}
function computeAllBankers(round){return Array.from({length:18},(_,h)=>getBankerForHole(round,h));}
function holeMatchups(round,holeIdx){
  const bankerIdx=round.bankers[holeIdx];
  if(bankerIdx===undefined||bankerIdx===null)return{bankerIdx:0,matchups:[]};
  const scores=round.scores[holeIdx]||[],doubles=round.doubles&&round.doubles[holeIdx],si=round.strokeIndexes;
  const bankerNet=netScore(scores[bankerIdx],round.players[bankerIdx].hcp,holeIdx,si);
  const matchups=round.players.map((p,i)=>{
    if(i===bankerIdx)return null;
    const cNet=netScore(scores[i],p.hcp,holeIdx,si),bet=getBetAmount(doubles,i);
    let result='pending',dollar=0;
    if(bankerNet!==null&&cNet!==null){if(cNet<bankerNet){result='win';dollar=bet;}else if(cNet>bankerNet){result='loss';dollar=-bet;}else result='push';}
    return{challengerIdx:i,bankerNet,challengerNet:cNet,result,betAmt:bet,dollar};
  }).filter(Boolean);
  return{bankerIdx,matchups};
}
function findUnresolvedTies(round){
  const ties=[];
  for(let h=0;h<17;h++){
    const nets=round.players.map((p,i)=>netScore(round.scores[h][i],p.hcp,h,round.strokeIndexes));
    const valid=nets.filter(n=>n!==null);if(valid.length<2)continue;
    const min=Math.min(...valid),tied=nets.map((n,i)=>n===min?i:-1).filter(i=>i>=0);
    if(tied.length<2)continue;
    const key=String(h);
    if(round.tieResolution&&round.tieResolution[key]&&round.tieResolution[key].winner!==undefined)continue;
    const prevBanker=getBankerForHole(round,h);
    ties.push({holeIdx:h,tied,prevBanker,prevInTie:tied.includes(prevBanker)});
  }
  return ties;
}
function ensureDoubles(round){if(!round.doubles)round.doubles=Array.from({length:18},()=>null);while(round.doubles.length<18)round.doubles.push(null);}
function computeTotals(round){
  const totals=round.players.map(()=>0);
  for(let h=0;h<18;h++){const{bankerIdx,matchups}=holeMatchups(round,h);matchups.forEach(m=>{if(m.result==='pending')return;totals[m.challengerIdx]+=m.dollar;totals[bankerIdx]-=m.dollar;});}
  return totals;
}
function computeSettlement(totals){
  const bal=totals.map((t,i)=>({i,bal:t})),payments=[],eps=0.001;
  for(let iter=0;iter<100;iter++){
    bal.sort((a,b)=>a.bal-b.bal);const d=bal[0],c=bal[bal.length-1];
    if(Math.abs(d.bal)<eps||Math.abs(c.bal)<eps||d.bal>=-eps)break;
    const amt=Math.min(-d.bal,c.bal);if(amt<eps)break;
    payments.push({from:d.i,to:c.i,amount:Math.round(amt*100)/100});d.bal+=amt;c.bal-=amt;
  }
  return payments;
}
function siIsValid(si){const vals=si.map(v=>parseInt(v));return vals.every(v=>!isNaN(v)&&v>=1&&v<=18)&&new Set(vals).size===18;}
function initials(n){return String(n||'').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2)||'?';}
function avatarColor(i){const c=[{bg:'#E1F5EE',color:'#085041'},{bg:'#E6F1FB',color:'#0C447C'},{bg:'#FAEEDA',color:'#633806'},{bg:'#FBEAF0',color:'#72243E'}];return c[i%c.length];}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ── Persistent storage using localStorage ──────────────────────────────────
const DB={
  save(){try{localStorage.setItem('gb_rounds',JSON.stringify(state.rounds));localStorage.setItem('gb_courses',JSON.stringify(state.courseDB));}catch(e){console.warn('Storage full',e);}},
  load(){
    try{
      const r=localStorage.getItem('gb_rounds');if(r)state.rounds=JSON.parse(r);
      const c=localStorage.getItem('gb_courses');if(c)state.courseDB=JSON.parse(c);
    }catch(e){console.warn('Load error',e);}
  }
};

// ── State ──────────────────────────────────────────────────────────────────
let state={
  view:'home',rounds:[],currentRound:null,courseDB:{},
  editingCourse:null,newRound:null,
  showAddPlayerForm:false,newPlayerName:'',newPlayerHcp:'',
  flipResult:null,activeHole:0,roundTab:'scorecard',
  tieModal:null,holePhase:'doubles',doubleSelection:new Set(),
  _returnToRound:false,
  ecSuggestions:[],ecShowSugg:false,
  nrSuggestions:[],nrShowSugg:false,
};
let liveInputs={ecName:'',nrCourse:''};

// ═══ RENDER ════════════════════════════════════════════════════════════════
function render(){
  const root=document.getElementById('root');root.innerHTML='';
  if(state.view==='home')renderHome(root);
  else if(state.view==='courses')renderCourses(root);
  else if(state.view==='edit-course')renderEditCourse(root);
  else if(state.view==='new-round')renderNewRound(root);
  else if(state.view==='flip')renderFlip(root);
  else if(state.view==='round')renderRound(root);
  else if(state.view==='settlement')renderSettlement(root);
  window.scrollTo(0,0);
}

// ── Home ───────────────────────────────────────────────────────────────────
function renderHome(root){
  const sc=Object.keys(state.courseDB).length;
  root.innerHTML=`
    <div class="header">
      <div class="header-icon"><i class="ti ti-golf"></i></div>
      <div><h1>Golf Banker</h1><p>Track your rounds and side bets</p></div>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-bottom:1rem;flex-wrap:wrap;">
      <button class="btn" onclick="goCourses()"><i class="ti ti-map-pin"></i> Courses${sc>0?` <span style="background:var(--green-light);color:var(--green-dark);padding:1px 7px;border-radius:99px;font-size:11px;font-weight:600">${sc}</span>`:''}</button>
      <button class="btn btn-primary" onclick="startNewRound()"><i class="ti ti-plus"></i> New Round</button>
    </div>
    ${state.rounds.length===0?`
      <div class="card"><div class="empty-state"><i class="ti ti-golf"></i>

    </div>
    <div class="tabs">
      <button class="tab ${state.roundTab==='scorecard'?'active':''}" onclick="setTab('scorecard')">Scorecard</button>
      <button class="tab ${state.roundTab==='bets'?'active':''}" onclick="setTab('bets')">Bets & Results</button>
    </div>
    ${state.roundTab==='scorecard'?renderScorecard(round):renderBets(round)}
    ${tie?renderTieModal(round,tie):''}`;
}

function renderScorecard(round){
  const h=state.activeHole,banker=round.bankers[h],allIdxs=round.players.map((_,i)=>i);
  if(state.holePhase==='doubles')return renderDoublesPhase(round,h,banker,allIdxs);
  return renderScoresPhase(round,h,banker);
}

function renderDoublesPhase(round,h,banker,allIdxs){
  const sel=state.doubleSelection,pd=resolveDoubles(sel,banker,allIdxs),challengers=allIdxs.filter(i=>i!==banker);
  const summary=[];
  if(sel.size>0){
    const{bankerDoubledGroup,challengerDoubled,bankerDoubledBack}=pd;
    if(bankerDoubledGroup){summary.push(`<span style="color:#633806;font-weight:600">${esc(round.players[banker].name)} doubled the group → everyone $${BASE_BET*2}</span>`);const b=challengers.filter(i=>bankerDoubledBack[i]);if(b.length)summary.push(`<span style="color:#791F1F;font-weight:600">Doubled back: ${b.map(i=>esc(round.players[i].name)).join(', ')} → $${BASE_BET*4}</span>`);}
    else{const w=challengers.filter(i=>challengerDoubled[i]);if(w.length)summary.push(`<span style="color:var(--green-dark);font-weight:600">${w.map(i=>esc(round.players[i].name)).join(', ')} doubled → $${BASE_BET*2}</span>`);}
  }
  return`
    <div class="banker-announce"><i class="ti ti-star-filled" style="color:var(--amber)"></i><span>Hole ${h+1} Banker: <strong>${esc(round.players[banker].name)}</strong></span>${round.strokeIndexes?`<span style="margin-left:auto;font-size:11px;background:rgba(0,0,0,0.1);padding:2px 8px;border-radius:99px">SI ${round.strokeIndexes[h]}</span>`:''}</div>
    <div class="card">
      <div class="card-header" style="margin-bottom:0.5rem"><span class="card-title">Did anyone double?</span><span style="font-size:12px;color:var(--text-sec)">Hole ${h+1}</span></div>
      <p style="font-size:14px;color:var(--text-sec);margin-bottom:1rem;">Tap players who declared a double on the tee.</p>
      ${round.players.map((p,i)=>{const av=avatarColor(i),isBank=i===banker,isSel=sel.has(i),selClass=isSel?(isBank?'selected-banker':'selected-challenger'):'',previewAmt=isBank?null:getBetAmount(pd,i),betClass=previewAmt===null?'':previewAmt>=BASE_BET*4?'bet-max':previewAmt>BASE_BET?'bet-doubled':'bet-base',strokes=strokesOnHole(p.hcp,h,round.strokeIndexes);
      return`<button class="player-sel-btn ${selClass}" onclick="toggleDoubleSelect(${i})">
        <div class="sel-check">${isSel?'<i class="ti ti-check" style="font-size:13px"></i>':''}</div>
        <div class="player-avatar" style="background:${av.bg};color:${av.color};width:34px;height:34px;font-size:12px;flex-shrink:0">${initials(p.name)}</div>
        <div style="flex:1;text-align:left">
          <div style="font-size:15px;font-weight:${isBank?600:400};color:var(--text)">${esc(p.name)}</div>
          <div style="font-size:12px;color:var(--text-sec)">${isBank?'Banker':'HCP '+p.hcp+(strokes>0?' · -'+strokes+' stroke'+(strokes>1?'s':''):'')}</div>
        </div>
        ${!isBank?`<span class="bet-chip ${betClass}">$${previewAmt}</span>`:''}
      </button>`;}).join('')}
      ${sel.size>0?`<div style="margin-top:10px;padding:10px 12px;background:var(--bg-sec);border-radius:var(--radius-md);display:flex;flex-direction:column;gap:4px;">${summary.map(s=>`<div style="font-size:14px">${s}</div>`).join('')}</div>`:''}
      <div style="display:flex;gap:8px;margin-top:1.25rem;justify-content:flex-end;">
        <button class="btn" onclick="confirmDoubles(true)">No doubles</button>
        <button class="btn btn-primary" onclick="confirmDoubles(false)">${sel.size>0?'Confirm':'No doubles'} <i class="ti ti-arrow-right"></i></button>
      </div>
    </div>
    <div class="card" style="padding:0.75rem;"><div class="section-label" style="margin-bottom:6px">Jump to hole</div><div style="display:flex;flex-wrap:wrap;gap:4px;">${Array.from({length:18},(_,i)=>{const has=round.scores[i].some(s=>s!==''&&s!==null),d=round.doubles[i],anyD=d&&(d.bankerDoubledGroup||Object.values(d.challengerDoubled||{}).some(Boolean));return`<button class="btn btn-sm ${i===h?'btn-primary':''}" onclick="jumpToHole(${i})" style="min-width:34px;${has&&i!==h?'border-color:var(--green);color:var(--green-dark)':''}${anyD&&i!==h?';background:var(--gold-light);border-color:var(--amber)':''}">${i+1}${anyD?'✕':''}</button>`;}).join('')}</div></div>`;
}

function renderScoresPhase(round,h,banker){
  const doubles=round.doubles[h],summary=doublesSummary(doubles,banker,round.players),si=round.strokeIndexes;
  return`
    <div class="banker-announce"><i class="ti ti-star-filled" style="color:var(--amber)"></i><span>Hole ${h+1} Banker: <strong>${esc(round.players[banker].name)}</strong></span>${si?`<span style="font-size:11px;background:rgba(0,0,0,0.1);padding:2px 8px;border-radius:99px">SI ${si[h]}</span>`:''}<button class="btn btn-sm" onclick="editDoubles()" style="margin-left:auto;font-size:11px;padding:4px 8px"><i class="ti ti-arrows-exchange"></i> Doubles</button></div>
    ${summary?`<div style="background:var(--gold-light);border:1px solid var(--amber);border-radius:var(--radius-md);padding:10px 14px;margin-bottom:1rem;">${summary.map(s=>`<div style="font-size:13px;color:#633806;font-weight:600">${esc(s)}</div>`).join('')}</div>`:''}
    <div class="card">
      <div class="card-header">
        <span class="card-title">Hole ${h+1} — Scores</span>
        ${h<17?`<button class="btn btn-sm btn-primary" onclick="nextHole()">Next <i class="ti ti-arrow-right"></i></button>`:`<button class="btn btn-sm btn-gold" onclick="goToSettlement()"><i class="ti ti-receipt"></i> Settle up</button>`}
      </div>
      <div style="display:grid;grid-template-columns:1fr 50px 50px 64px 72px;gap:5px;margin-bottom:8px;padding:0 4px;">
        <div class="section-label" style="margin:0;line-height:2">Player</div>
        <div class="section-label" style="margin:0;text-align:center;line-height:2">Gross</div>
        <div class="section-label" style="margin:0;text-align:center;line-height:2">Net</div>
        <div class="section-label" style="margin:0;text-align:center;line-height:2">Result</div>
        <div class="section-label" style="margin:0;text-align:center;line-height:2">$ Chg</div>
      </div>
      ${round.players.map((p,i)=>{
        const av=avatarColor(i),gross=round.scores[h][i],strokes=strokesOnHole(p.hcp,h,si),net=netScore(gross,p.hcp,h,si),isBank=i===banker,betAmt=isBank?null:getBetAmount(doubles,i);
        let resultPill='',dollarCell='';
        if(isBank){resultPill=`<span class="pill pill-bank">Banker</span>`;const{matchups}=holeMatchups(round,h);const tot=matchups.reduce((s,m)=>m.result==='win'?s-m.betAmt:m.result==='loss'?s+m.betAmt:s,0);if(matchups.some(m=>m.result!=='pending'))dollarCell=`<span style="font-size:13px;font-weight:700;color:${tot>=0?'var(--green)':'var(--red)'}"> ${tot>=0?'+$':'-$'}${Math.abs(tot)}</span>`;}
        else{const bNet=netScore(round.scores[h][banker],round.players[banker].hcp,h,si);if(net!==null&&bNet!==null){if(net<bNet){resultPill=`<span class="pill pill-win">Win</span>`;dollarCell=`<span style="font-size:13px;font-weight:700;color:var(--green)">+$${betAmt}</span>`;}else if(net>bNet){resultPill=`<span class="pill pill-loss">Loss</span>`;dollarCell=`<span style="font-size:13px;font-weight:700;color:var(--red)">-$${betAmt}</span>`;}else{resultPill=`<span class="pill pill-push">Push</span>`;dollarCell=`<span style="font-size:13px;color:var(--text-sec)">$0</span>`;} }}
        return`<div style="display:grid;grid-template-columns:1fr 50px 50px 64px 72px;gap:5px;align-items:center;margin-bottom:8px;padding:8px;border-radius:10px;background:${isBank?'var(--gold-light)':'transparent'}">
          <div style="display:flex;align-items:center;gap:8px;">
            <div class="player-avatar" style="background:${av.bg};color:${av.color};width:30px;height:30px;font-size:11px">${initials(p.name)}</div>
            <div><div style="font-size:13px;font-weight:${isBank?600:400};color:var(--text)">${esc(p.name)}</div><div style="font-size:10px;color:var(--text-sec)">-${strokes}${isBank?'':' · $'+betAmt}</div></div>
          </div>
          <div style="text-align:center"><input class="hole-input" type="number" min="1" max="20" placeholder="—" value="${gross!==''&&gross!==null?gross:''}" onchange="setScore(${h},${i},this.value)" oninput="setScore(${h},${i},this.value)"/></div>
          <div style="text-align:center;font-size:15px;font-weight:600;color:var(--text)">${net!==null?net:'—'}</div>
          <div style="text-align:center">${resultPill}</div>
          <div style="text-align:center">${dollarCell}</div>
        </div>`;
      }).join('')}
    </div>
    <div class="card" style="padding:0.75rem 0.5rem;">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:0 0.75rem;margin-bottom:0.75rem;"><span class="card-title">Full Scorecard</span><div style="display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end;">${Array.from({length:18},(_,i)=>{const has=round.scores[i].some(s=>s!==''&&s!==null),d=round.doubles[i],anyD=d&&(d.bankerDoubledGroup||Object.values(d.challengerDoubled||{}).some(Boolean));return`<button class="btn btn-sm ${i===h?'btn-primary':''}" onclick="jumpToHole(${i})" style="padding:3px 6px;font-size:11px;min-width:28px;${has&&i!==h?'border-color:var(--green);color:var(--green-dark)':''}${anyD&&i!==h?';background:var(--gold-light);border-color:var(--amber)':''}">${i+1}${anyD?'✕':''}</button>`;}).join('')}</div></div>
      <div class="score-table-wrap"><table class="score-table">
        <thead><tr><th>Player</th>${Array.from({length:18},(_,i)=>`<th style="${i===h?'background:#633806':''}">${i+1}</th>`).join('')}<th>Tot</th></tr></thead>
        <tbody>
          ${round.players.map((p,i)=>{const av=avatarColor(i),total=round.scores.reduce((s,hole)=>{const g=hole[i];return s+(g!==''&&g!==null&&!isNaN(parseInt(g))?parseInt(g):0);},0);return`<tr>
            <td><div style="display:flex;align-items:center;gap:5px;"><div class="player-avatar" style="background:${av.bg};color:${av.color};width:20px;height:20px;font-size:9px">${initials(p.name)}</div><span style="color:var(--text)">${esc(p.name.split(' ')[0])}</span></div></td>
            ${Array.from({length:18},(_,hh)=>{const g=round.scores[hh][i],net=netScore(g,p.hcp,hh,si),isBank=round.bankers[hh]===i,d=round.doubles[hh],bet=!isBank&&d?getBetAmount(d,i):BASE_BET;return`<td style="${isBank?'background:var(--gold-light)':''}${hh===h?';outline:2px solid var(--green);outline-offset:-2px;border-radius:2px':''}">${g!==''&&g!==null?`<div style="font-weight:${isBank?600:400};color:var(--text)">${g}</div><div class="net-score">${net}${!isBank&&bet>BASE_BET?'<span style="color:var(--amber)">✕</span>':''}</div>`:'<span style="color:var(--border-md)">·</span>'}</td>`;}).join('')}
            <td style="font-weight:700;color:var(--text)">${total||'—'}</td>
          </tr>`;}).join('')}
          <tr style="background:var(--bg-sec)"><td style="font-size:10px;color:var(--text-sec)">Banker</td>${Array.from({length:18},(_,hh)=>{const b=round.bankers[hh],av=avatarColor(b);return`<td><div class="player-avatar" style="background:${av.bg};color:${av.color};width:18px;height:18px;font-size:8px;margin:0 auto">${initials(round.players[b].name)}</div></td>`;}).join('')}<td></td></tr>
        </tbody>
      </table></div>
    </div>`;
}

function renderBets(round){
  const totals=round.players.map(()=>0),holeResults=[];
  for(let hh=0;hh<18;hh++){const{bankerIdx,matchups}=holeMatchups(round,hh);let bT=0;const row={holeIdx:hh,bankerIdx,cells:{}};matchups.forEach(m=>{if(m.result==='pending')return;totals[m.challengerIdx]+=m.dollar;totals[bankerIdx]-=m.dollar;bT-=m.dollar;row.cells[m.challengerIdx]={result:m.result,dollar:m.dollar,bet:m.betAmt};});row.cells[bankerIdx]={result:'banker',dollar:bT};holeResults.push(row);}
  return`
    <div class="card"><div class="card-header"><span class="card-title">Running Totals</span><button class="btn btn-sm btn-gold" onclick="goToSettlement()"><i class="ti ti-receipt"></i> Settle up</button></div>
      ${round.players.map((p,i)=>{const av=avatarColor(i),net=totals[i];return`<div class="tally-row"><div class="player-avatar" style="background:${av.bg};color:${av.color};width:36px;height:36px;font-size:13px">${initials(p.name)}</div><div style="flex:1"><div style="font-size:15px;font-weight:600;color:var(--text)">${esc(p.name)}</div><div style="font-size:12px;color:var(--text-sec)">HCP ${p.hcp}</div></div><div class="tally-net ${net>0?'pos':net<0?'neg':'zero'}">${net>=0?'+$':'-$'}${Math.abs(net)}</div></div>`;}).join('')}
    </div>
    <div class="card" style="padding:0.75rem 0.5rem;"><div class="card-title" style="padding:0 0.75rem;margin-bottom:0.75rem;">Hole-by-Hole Results</div>
      <div class="score-table-wrap"><table class="score-table">
        <thead><tr><th>Hole</th><th>Banker</th>${round.players.map(p=>`<th>${esc(p.name.split(' ')[0])}</th>`).join('')}</tr></thead>
        <tbody>${holeResults.map(row=>{const{holeIdx,bankerIdx,cells}=row,has=round.scores[holeIdx].some(s=>s!==''&&s!==null),av=avatarColor(bankerIdx),d=round.doubles[holeIdx],anyD=d&&(d.bankerDoubledGroup||Object.values(d.challengerDoubled||{}).some(Boolean));return`<tr><td style="font-weight:700;color:var(--text)">${holeIdx+1}${anyD?'<span style="font-size:9px;background:var(--gold-light);color:#633806;padding:1px 4px;border-radius:4px;margin-left:3px">✕</span>':''}</td><td><div class="player-avatar" style="background:${av.bg};color:${av.color};width:20px;height:20px;font-size:9px;margin:0 auto">${initials(round.players[bankerIdx].name)}</div></td>${round.players.map((p,i)=>{const cell=cells[i];if(!has||!cell)return`<td><span style="color:var(--border)">·</span></td>`;if(cell.result==='banker')return`<td><span style="font-size:12px;font-weight:700;color:${cell.dollar>0?'var(--green)':cell.dollar<0?'var(--red)':'var(--text-sec)'}">${cell.dollar>0?'+$':cell.dollar<0?'-$':'±'}${cell.dollar!==0?Math.abs(cell.dollar):'0'}</span></td>`;if(cell.result==='push')return`<td><span class="pill pill-push">Push</span></td>`;const won=cell.result==='win';return`<td><span class="pill ${won?'pill-win':'pill-loss'}">${won?'Win':'Loss'}</span><div style="font-size:10px;font-weight:700;color:${won?'var(--green-dark)':'#791F1F'};margin-top:1px">${won?'+$':'-$'}${cell.bet}</div></td>`;}).join('')}</tr>`;}).join('')}</tbody>
      </table></div>
    </div>`;
}

function goToSettlement(){state.view='settlement';render();}
function renderSettlement(root){
  const round=state.currentRound;if(!round){goHome();return;}
  const totals=computeTotals(round),payments=computeSettlement([...totals]),allDone=round.scores.every(h=>h.every(s=>s!==''&&s!==null));
  root.innerHTML=`
    <div class="header"><button class="btn btn-sm" onclick="backToRound()"><i class="ti ti-arrow-left"></i> Back</button><div style="flex:1;min-width:0;"><h1 style="font-size:16px;">Settlement</h1><p style="font-size:12px;">${esc(round.course)} · ${round.date}</p></div></div>
    ${!allDone?`<div style="background:var(--gold-light);border:1px solid var(--amber);border-radius:var(--radius-md);padding:10px 14px;margin-bottom:1rem;font-size:13px;color:#633806;"><i class="ti ti-alert-triangle"></i> Not all holes scored — totals are partial.</div>`:''}
    <div class="card"><div class="card-title" style="margin-bottom:1rem">Round Totals</div>
      ${round.players.map((p,i)=>{const av=avatarColor(i),net=totals[i];return`<div class="tally-row"><div class="player-avatar" style="background:${av.bg};color:${av.color};width:38px;height:38px;font-size:14px">${initials(p.name)}</div><div style="flex:1"><div style="font-size:16px;font-weight:600;color:var(--text)">${esc(p.name)}</div><div style="font-size:12px;color:var(--text-sec)">HCP ${p.hcp}</div></div><div style="text-align:right"><div class="tally-net ${net>0?'pos':net<0?'neg':'zero'}" style="font-size:24px">${net>=0?'+$':'-$'}${Math.abs(net)}</div><div style="font-size:12px;color:var(--text-sec)">${net>0?'Collects':net<0?'Owes':'Even'}</div></div></div>`;}).join('')}
    </div>
    <div class="card"><div class="card-title" style="margin-bottom:1rem"><i class="ti ti-cash"></i> Who Pays Who</div>
      ${payments.length===0?`<div style="text-align:center;padding:1.5rem 0;color:var(--text-sec);font-size:15px;">🎉 Everyone is even!</div>`:`${payments.map(pmt=>{const fA=avatarColor(pmt.from),tA=avatarColor(pmt.to);return`<div class="payment-row"><div class="player-avatar" style="background:${fA.bg};color:${fA.color};width:40px;height:40px;font-size:14px">${initials(round.players[pmt.from].name)}</div><div style="flex:1;min-width:0;"><div style="font-size:14px;font-weight:600;color:var(--text)">${esc(round.players[pmt.from].name)}</div><div style="font-size:12px;color:var(--text-sec)">pays</div></div><div class="amount-chip">$${pmt.amount}</div><div style="padding:0 6px;color:var(--text-sec);font-size:20px">→</div><div style="flex:1;min-width:0;text-align:right"><div style="font-size:14px;font-weight:600;color:var(--text)">${esc(round.players[pmt.to].name)}</div><div style="font-size:12px;color:var(--text-sec)">receives</div></div><div class="player-avatar" style="background:${tA.bg};color:${tA.color};width:40px;height:40px;font-size:14px">${initials(round.players[pmt.to].name)}</div></div>`;}).join('')}`}
    </div>
    <div style="display:flex;gap:8px;justify-content:center;margin-top:0.5rem;flex-wrap:wrap;">
      <button class="btn" onclick="backToRound()"><i class="ti ti-arrow-left"></i> Back to round</button>
      <button class="btn btn-primary" onclick="goHome()"><i class="ti ti-home"></i> Home</button>
    </div>`;
}

function renderTieModal(round,tie){
  const tm=state.tieModal;if(!tm)return'';const{holeIdx,tied,prevInTie}=tm;
  if(tm.step==='flip'){const done=tm.flipResult!==null;return`<div class="modal-overlay"><div class="modal"><h2><i class="ti ti-arrows-shuffle" style="color:var(--amber)"></i> Tee Flip — Hole ${holeIdx+2} Banker</h2><div class="modal-step">Putts unknown. Flip between ${tied.map(i=>esc(round.players[i].name)).join(' & ')}.</div>${done?`<div class="flip-result"><div class="emoji">⛳</div><div class="winner">${esc(round.players[tm.flipResult].name)}</div><span class="badge badge-gold"><i class="ti ti-star"></i> Banks hole ${holeIdx+2}</span></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">${tied.map(i=>`<button class="btn btn-sm ${i===tm.flipResult?'btn-gold':''}" onclick="tieFlipSelect(${i})">${esc(round.players[i].name)}</button>`).join('')}</div><div class="modal-actions"><button class="btn" onclick="tieModalFlip()"><i class="ti ti-refresh"></i> Reflip</button><button class="btn btn-primary" onclick="confirmTieFlip()">Confirm</button></div>`:`<div class="flip-result"><div class="emoji">🎲</div></div><div style="display:flex;gap:8px;justify-content:center;margin-bottom:1rem;"><button class="btn btn-gold" onclick="tieModalFlip()"><i class="ti ti-arrows-shuffle"></i> Flip!</button></div><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;">${tied.map(i=>`<button class="btn btn-sm" onclick="tieFlipSelect(${i})">${esc(round.players[i].name)}</button>`).join('')}</div>`}</div></div>`;}
  return`<div class="modal-overlay"><div class="modal"><h2><i class="ti ti-scale" style="color:var(--amber)"></i> Tie on Hole ${holeIdx+1}</h2><div class="modal-step">${tied.map(i=>esc(round.players[i].name)).join(' & ')} tied for low net. ${prevInTie?`${esc(round.players[tm.prevBanker].name)} was banker — retains if putts unknown.`:`Neither was banker — tee flip decides.`}</div><div class="section-label">Putt lengths (ft) — leave blank if unknown</div>${tied.map(i=>{const av=avatarColor(i),val=tm.putts&&tm.putts[i]!=null?tm.putts[i]:'';return`<div class="player-row" style="margin-top:8px"><div class="player-avatar" style="background:${av.bg};color:${av.color};width:34px;height:34px;font-size:13px">${initials(round.players[i].name)}</div><span style="flex:1;font-size:15px;color:var(--text)">${esc(round.players[i].name)}</span>${round.bankers[holeIdx]===i?`<span class="badge badge-gold" style="margin-right:4px">Prior banker</span>`:''}<input type="number" class="putt-input" placeholder="ft" min="0" step="0.5" value="${val}" oninput="tieSetPutt(${i},this.value)"/></div>`;}).join('')}<div class="modal-actions"><button class="btn" onclick="confirmTiePutts(true)">Skip</button><button class="btn btn-primary" onclick="confirmTiePutts(false)">Confirm</button></div></div></div>`;
}

// ── Actions ────────────────────────────────────────────────────────────────
function toggleDoubleSelect(i){if(state.doubleSelection.has(i))state.doubleSelection.delete(i);else state.doubleSelection.add(i);render();}
function confirmDoubles(noDoubles){const round=state.currentRound,h=state.activeHole,banker=round.bankers[h],allIdxs=round.players.map((_,i)=>i);round.doubles[h]=noDoubles||state.doubleSelection.size===0?null:resolveDoubles(state.doubleSelection,banker,allIdxs);state.holePhase='scores';state.doubleSelection=new Set();DB.save();render();}
function editDoubles(){const round=state.currentRound,h=state.activeHole,banker=round.bankers[h],d=round.doubles[h];state.doubleSelection=new Set();if(d){if(d.bankerDoubledGroup){state.doubleSelection.add(banker);Object.keys(d.bankerDoubledBack||{}).forEach(i=>{if(d.bankerDoubledBack[i])state.doubleSelection.add(parseInt(i));});}else Object.keys(d.challengerDoubled||{}).forEach(i=>{if(d.challengerDoubled[i])state.doubleSelection.add(parseInt(i));});}state.holePhase='doubles';render();}
function tieSetPutt(pi,val){if(!state.tieModal.putts)state.tieModal.putts={};state.tieModal.putts[pi]=val===''?null:parseFloat(val);}
function tieModalFlip(){state.tieModal.flipResult=state.tieModal.tied[Math.floor(Math.random()*state.tieModal.tied.length)];render();}
function tieFlipSelect(i){state.tieModal.flipResult=i;render();}
function confirmTiePutts(skip){const tm=state.tieModal,{holeIdx,tied,prevBanker,prevInTie}=tm;if(!skip&&tm.putts){let best=-1,bestIdx=-1;tied.forEach(i=>{const p=tm.putts[i];if(p!=null&&p>best){best=p;bestIdx=i;}});if(bestIdx>=0&&tied.filter(i=>tm.putts[i]===best).length===1){resolveWithWinner(holeIdx,bestIdx);return;}}if(prevInTie)resolveWithWinner(holeIdx,prevBanker);else{tm.step='flip';tm.flipResult=null;render();}}
function confirmTieFlip(){if(state.tieModal.flipResult===null)return;resolveWithWinner(state.tieModal.holeIdx,state.tieModal.flipResult);}
function resolveWithWinner(holeIdx,winnerIdx){const round=state.currentRound;if(!round.tieResolution)round.tieResolution={};round.tieResolution[String(holeIdx)]={winner:winnerIdx};round.bankers=computeAllBankers(round);state.tieModal=null;DB.save();render();}
function setScore(h,i,val){state.currentRound.scores[h][i]=val===''?'':parseInt(val);state.currentRound.bankers=computeAllBankers(state.currentRound);DB.save();clearTimeout(window._st);window._st=setTimeout(render,300);}
function nextHole(){if(state.activeHole<17){state.activeHole++;state.holePhase='doubles';state.doubleSelection=new Set();render();}}
function jumpToHole(h){state.activeHole=h;const round=state.currentRound;state.holePhase=round.scores[h].some(s=>s!==''&&s!==null)?'scores':'doubles';state.doubleSelection=new Set();render();}
function setTab(t){state.roundTab=t;render();}
function backToRound(){state.view='round';render();}
function goHome(){state.view='home';state.currentRound=null;state.tieModal=null;render();}
function openRound(id){
  state.currentRound=state.rounds.find(r=>r.id===id);if(!state.currentRound)return;
  if(!state.currentRound.tieResolution)state.currentRound.tieResolution={};
  ensureDoubles(state.currentRound);if(!state.currentRound.strokeIndexes)state.currentRound.strokeIndexes=null;
  state.currentRound.bankers=computeAllBankers(state.currentRound);
  let last=0;for(let h=0;h<18;h++){if(state.currentRound.scores[h].some(s=>s!==''&&s!==null))last=h;}
  state.activeHole=last;state.view='round';state.roundTab='scorecard';state.tieModal=null;state.holePhase='scores';state.doubleSelection=new Set();render();
}

// Boot
DB.load();render();
</script>
